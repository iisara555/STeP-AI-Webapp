project_id = "step-ai-webapp"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 900
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_LOGIN_CLIENT_ID)"
secret = "env(GOOGLE_LOGIN_CLIENT_SECRET)"
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.api]
verify_jwt = false

[functions.worker]
verify_jwt = false

[functions.google-callback]
verify_jwt = false
