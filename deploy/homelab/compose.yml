name: step-ai-pilot
services:
  web:
    image: step-ai-webapp:${STEP_IMAGE_TAG:-pilot}
    build:
      context: ../..
      dockerfile: deploy/homelab/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set the hosted Supabase URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set a modern publishable key}
    ports:
      - '127.0.0.1:${STEP_HTTP_PORT:-8080}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
  # Optional Thai OCR (Typhoon OCR V2 0.8B + PaddleOCR number check). Start with --profile ocr after
  # fetch-models.sh; without it the web reads receipts with the AI alone, as before. No port is published.
  ocr:
    profiles: ['ocr']
    image: step-thai-ocr:${STEP_OCR_IMAGE_TAG:-pilot}
    build:
      context: ../..
      dockerfile: deploy/homelab/ocr/Dockerfile
    environment:
      STEP_TYPHOON_THREADS: ${STEP_OCR_THREADS:-8}
    volumes:
      - ${STEP_OCR_MODELS:-../../.local/ocr-models}:/opt/typhoon/models:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: ${STEP_OCR_THREADS:-8}
