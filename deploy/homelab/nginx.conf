worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's DNS: the optional OCR service and Supabase are looked up per request, so the web starts without them.
    resolver 127.0.0.11 ipv6=off valid=30s;
    # A few OCR readings a minute per signed-in user; the service itself reads one file at a time.
    limit_req_zone $http_authorization zone=ocr:1m rate=6r/m;

    map $uri $cache_control {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }
        # The organization's Thai OCR (deploy/homelab/ocr). Only a signed-in Supabase user reaches it: the token is
        # checked with Supabase before any byte goes to the service, and the service never sees the token.
        location = /_ocr_auth {
            internal;
            set $supabase __SUPABASE_URL__;
            proxy_pass $supabase/auth/v1/user;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header apikey "__SUPABASE_PUBLISHABLE_KEY__";
            proxy_set_header Host __SUPABASE_HOST__;
            proxy_ssl_server_name on;
            proxy_ssl_name __SUPABASE_HOST__;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_read_timeout 10s;
        }
        location = /ocr/api/health {
            limit_except GET { deny all; }
            auth_request /_ocr_auth;
            set $ocr http://ocr:8765;
            proxy_pass $ocr/api/health;
            proxy_set_header Host ocr;
            proxy_set_header Origin "";
            proxy_set_header Authorization "";
            proxy_read_timeout 10s;
            access_log off;
        }
        location = /ocr/api/ocr {
            limit_except POST { deny all; }
            auth_request /_ocr_auth;
            limit_req zone=ocr burst=2 nodelay;
            limit_req_status 429;
            client_max_body_size 25m;
            client_body_buffer_size 1m;
            set $ocr http://ocr:8765;
            proxy_pass $ocr/api/ocr?filename=$arg_filename;
            proxy_set_header Host ocr;
            proxy_set_header Origin "";
            proxy_set_header Authorization "";
            proxy_read_timeout 960s;
            proxy_send_timeout 60s;
            access_log off;
        }
        location ~ (^|/)\. { return 404; }
        location = /_headers { return 404; }
        location = /_redirects { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
